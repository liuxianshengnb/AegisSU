name: Build AegisSU APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and prepare source code
        run: |
          unzip -o AegisSU-RootManager.zip
          printf "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nandroid.suppressUnsupportedCompileSdk=35\n" > AegisSU/gradle.properties
          sed -i 's|""mkdir 0750 overlay.d" "|"\x27mkdir 0750 overlay.d\x27 "|g' AegisSU/app/src/main/java/com/aegissu/manager/core/BootImagePatcher.kt || true
          sed -i 's|""mkdir 0750 overlay.d/sbin" "|"\x27mkdir 0750 overlay.d/sbin\x27 "|g' AegisSU/app/src/main/java/com/aegissu/manager/core/BootImagePatcher.kt || true
          sed -i 's|""add 04755 overlay.d/sbin/su ${nativeSu.absolutePath}""\vert{}"\x27add 04755 overlay.d/sbin/su ${nativeSu.absolutePath}\x27"|g' AegisSU/app/src/main/java/com/aegissu/manager/core/BootImagePatcher.kt || true
          sed -i '102s/@Composable//' AegisSU/app/src/main/java/com/aegissu/manager/MainActivity.kt || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK and CMake
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Release APK
        working-directory: AegisSU
        run: gradle assembleRelease --no
